<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#1C2236;color:#F4F5F7;font-family:Arial,Helvetica,sans-serif;overflow:hidden}
#wrap{position:absolute;top:0;left:0;right:0;bottom:0;padding:3% 4%}
#head{height:14%;position:relative}
#head img{height:80%;max-height:110px}
#reloj{position:absolute;right:0;top:0;text-align:right}
#hora{display:block;font-size:64px;font-size:7vh;font-weight:bold;line-height:1}
#fecha{font-size:24px;font-size:2.6vh;color:#A9B1C4}
#centro{position:absolute;left:4%;right:4%;top:20%;bottom:22%;text-align:center}
#espera{padding-top:8%}
#espera b{display:block;font-size:64px;font-size:7vh;line-height:1.2}
#espera span{display:block;font-size:30px;font-size:3.4vh;color:#A9B1C4;margin-top:2%}
#turno{display:none}
#lbl{font-size:54px;font-size:6vh;font-weight:bold;letter-spacing:.3em;color:#A9B1C4}
#num{font-size:340px;font-size:40vh;font-weight:bold;line-height:1;color:#F4F5F7}
#num.flash{color:#EE552B}
#con{font-size:50px;font-size:5.5vh;font-weight:bold}
#rec{color:#EE552B}
#pie{position:absolute;left:4%;right:4%;bottom:4%;height:14%;border-top:4px solid #2B3450;padding-top:1.5%}
#pie .t{float:left;font-size:26px;font-size:3vh;color:#A9B1C4;margin:2% 3% 0 0}
.chip{float:left;background:#2B3450;border-radius:10px;padding:8px 22px;margin-right:18px;font-size:52px;font-size:6vh;font-weight:bold;line-height:1}
.chip small{display:block;font-size:20px;font-size:2.2vh;font-weight:normal;color:#A9B1C4;margin-top:6px}
#inicio{position:absolute;top:0;left:0;right:0;bottom:0;background:#141828;text-align:center;padding-top:14%;z-index:5}
#inicio h1{font-size:54px;font-size:6vh;margin-bottom:3%}
#inicio p{font-size:26px;font-size:2.6vh;color:#A9B1C4;margin:0 15% 3%}
#go{font-size:30px;font-size:3vh;font-weight:bold;padding:2% 5%;border:0;border-radius:10px;background:#EE552B;color:#fff}
#estado{position:absolute;right:1.5%;bottom:1%;font-size:14px;color:#5c6680}
</style>

    <div id="reloj"><b id="hora">--:--</b><span id="fecha"></span></div>
  </div>
  <div id="centro">
    <div id="espera"><b>Bienvenido</b><span>En breve te llamaremos por tu número. Mientras esperas, te invitamos a ver nuestros videos.</span></div>
    <div id="turno">
      <div id="lbl">TURNO</div>
      <div id="num">0</div>
      <div id="con">Pasa con <span id="rec"></span></div>

<div id="inicio">
  <h1>Pantalla de turnos</h1>
  <p>Presiona OK en el control (o da clic) para iniciar y activar el sonido de aviso. Si nadie la inicia, arranca sola en unos segundos.</p>
  <button id="go">Iniciar pantalla</button>
</div>
<div id="estado"></div>
<script>
var SCRIPT_URL='https://script.google.com/macros/s/AKfycbxgJ9GyRn0k6EBTbDpdTmgoanSvGA9rWpwsdH5OQrZwAX1oEBru2lUDPkZoQ3ah6a0Y/exec';
var CADA_SEG=5;
var ultimoId=null, audio=null, iniciada=false, seq=0;
var DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
var MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function $(id){return document.getElementById(id);}
function dos(n){return (n<10?'0':'')+n;}
function reloj(){
  var d=new Date();
  $('hora').innerHTML=dos(d.getHours())+':'+dos(d.getMinutes());
  var f=DIAS[d.getDay()]+', '+d.getDate()+' de '+MESES[d.getMonth()];
  $('fecha').innerHTML=f.charAt(0).toUpperCase()+f.slice(1);
}
setInterval(reloj,1000); reloj();
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function aviso(){
  try{
    var AC=window.AudioContext||window.webkitAudioContext; if(!AC)return;
    if(!audio)audio=new AC();
    var tiempos=[0,0.28];
    for(var i=0;i<tiempos.length;i++){
      var o=audio.createOscillator(), g=audio.createGain(), t=audio.currentTime+tiempos[i];
      o.frequency.value=i?660:880; o.connect(g); g.connect(audio.destination);
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.4,t+0.03); g.gain.exponentialRampToValueAtTime(0.0001,t+0.5);
      o.start(t); o.stop(t+0.55);
    }
  }catch(e){}
}
function decir(a){
  try{
    if(!window.speechSynthesis||!window.SpeechSynthesisUtterance)return;
    var u=new SpeechSynthesisUtterance('Turno '+a.num+'. Pasa con '+a.rec); u.lang='es-MX'; u.rate=0.9;
    setTimeout(function(){window.speechSynthesis.speak(u);},900);
  }catch(e){}
}
var flashes=0;
function parpadeo(){flashes=0;var t=setInterval(function(){var n=$('num');n.className=(n.className==='flash')?'':'flash';if(++flashes>=6){clearInterval(t);n.className='';}},500);}
function pintar(r){
  var a=r.actual;
  $('espera').style.display=a?'none':'block'; $('turno').style.display=a?'block':'none';
  if(a){$('num').innerHTML=a.num; $('rec').innerHTML=esc(a.rec);}
  var h='', hist=r.hist||[];
  for(var i=0;i<hist.length&&i<5;i++){h+='<div class="chip">'+hist[i].num+'<small>'+esc(hist[i].rec)+'</small></div>';}
  $('hist').innerHTML=h;
  if(a&&a.id!==ultimoId){ if(ultimoId!==null){parpadeo();if(iniciada){aviso();decir(a);}} ultimoId=a.id; }
  if(!a&&ultimoId===null)ultimoId='-';
}
// Consulta por JSONP: funciona incluso en navegadores de TV antiguos
function consultar(){
  seq++; var nombre='cbTurno'+seq, s=document.createElement('script'), listo=false;
  window[nombre]=function(r){listo=true; try{ if(r&&r.ok){pintar(r);$('estado').innerHTML='';} }catch(e){} limpiar();};
  function limpiar(){ try{delete window[nombre];}catch(e){window[nombre]=undefined;} if(s.parentNode)s.parentNode.removeChild(s); }
  s.onerror=function(){ $('estado').innerHTML='Sin conexión, reintentando…'; limpiar(); };
  setTimeout(function(){ if(!listo){ $('estado').innerHTML='Sin conexión, reintentando…'; limpiar(); } },15000);
  s.src=SCRIPT_URL+'?action=turno&callback='+nombre+'&t='+new Date().getTime();
  document.getElementsByTagName('head')[0].appendChild(s);
}
function iniciar(){
  if(iniciada)return; iniciada=true; aviso();
  $('inicio').style.display='none';
  try{var el=document.documentElement,rf=el.requestFullscreen||el.webkitRequestFullscreen; if(rf)rf.call(el);}catch(e){}
}
$('go').onclick=iniciar;
document.onkeydown=function(){iniciar();};
try{$('go').focus();}catch(e){}
setTimeout(function(){ if(!iniciada){ $('inicio').style.display='none'; } },20000);  // arranca sola (sin sonido) si nadie la inicia
consultar(); setInterval(consultar,CADA_SEG*1000);
</script>
